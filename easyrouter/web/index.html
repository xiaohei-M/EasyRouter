<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>易路由 · 管理控制台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=111">
<script src="/js/early.js?v=111"></script>
</head>
<body>

<div id="boot-status" class="boot-status">
  <span class="spinner"></span>
  <span>正在加载管理界面…</span>
  <span class="muted small">若此提示长时间不消失，请按 Ctrl + F5 强制刷新页面</span>
</div>
<noscript>
  <div class="boot-status error">
    <b>您的浏览器禁用了 JavaScript</b><br>
    管理界面需要 JavaScript 才能运行，请在浏览器设置中启用后刷新页面。
  </div>
</noscript>

<!-- ============ 登录 ============ -->
<div id="screen-login" class="screen hidden">
  <div class="center-card card">
    <div class="brand-head">
      <img src="/favicon.svg" alt="易路由" width="56" height="56">
      <h1>易路由</h1>
      <p>EasyRouter · 软路由管理控制台</p>
    </div>
    <form id="login-form" autocomplete="on">
      <label class="field"><span>用户名</span>
        <input id="login-user" value="admin" autocomplete="username">
      </label>
      <label class="field"><span>密码</span>
        <input id="login-pass" type="password" placeholder="请输入管理密码" autocomplete="current-password">
      </label>
      <div id="login-error" class="form-error hidden"></div>
      <button class="btn primary block" type="submit">登 录</button>
    </form>
    <p class="muted small" id="login-hint">演示模式初始密码：admin123</p>
  </div>
</div>

<!-- ============ 安装向导 ============ -->
<div id="screen-setup" class="screen hidden">
  <div class="center-card card wide">
    <div class="brand-head">
      <img src="/favicon.svg" alt="易路由" width="48" height="48">
      <h1>欢迎使用易路由</h1>
      <p>首次运行，请完成下面的安装向导（约 1 分钟）</p>
    </div>
    <ol class="setup-steps" id="setup-steps">
      <li class="active" data-step="1"><b>1</b>管理员密码</li>
      <li data-step="2"><b>2</b>选择网卡</li>
      <li data-step="3"><b>3</b>内网与 DHCP</li>
      <li data-step="4"><b>4</b>确认完成</li>
    </ol>
    <form id="setup-form">
      <div id="setup-body"></div>
      <div id="setup-error" class="form-error hidden"></div>
      <div class="row gap" style="justify-content:space-between">
        <button type="button" class="btn ghost" id="setup-prev">上一步</button>
        <button type="submit" class="btn primary" id="setup-next">下一步</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="/favicon.svg" alt="易路由" width="36" height="36">
      <div><b>易路由</b><small>EasyRouter</small></div>
    </div>
    <nav id="nav">
      <a data-view="overview" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/></svg>
        状态概览</a>
      <a data-view="devices">
        <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 014 4c0 2.4-1.6 3.7-2 4.6-.3.7-.3 1.4 0 2.2.5 1.2 2 2.1 2 4.6a4 4 0 01-8 0c0-2.5 1.5-3.4 2-4.6.3-.8.3-1.5 0-2.2-.4-.9-2-2.2-2-4.6a4 4 0 014-4z"/></svg>
        设备监控</a>
      <a data-view="leases">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        DHCP租约</a>
      <a data-view="traffic">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        流量监控</a>
      <a data-view="sessions">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        会话监控</a>
      <a data-view="apps">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        应用监控</a>
      <a data-view="gateways">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        出口网关</a>
      <a data-view="settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7zm7.4-3.1l1.6 1.3-2 3.4-1.9-.8a7 7 0 01-1.5.9l-.3 2h-4l-.3-2a7 7 0 01-1.5-.9l-1.9.8-2-3.4L5 12.4l-.6-1.6a7 7 0 010-1.6L5 7.6l-1.6-1.3 2-3.4 1.9.8a7 7 0 011.5-.9l.3-2h4l.3 2a7 7 0 011.5.9l1.9-.8 2 3.4-1.6 1.3.6 1.6a7 7 0 010 1.6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        网络设置</a>
      <a data-view="system">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="18" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        系统</a>
    </nav>
    <div class="side-foot" id="side-foot">v1.0.0</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-chips">
        <span class="chip" id="chip-wan"><i class="dot"></i>WAN · 未知</span>
        <span class="chip" id="chip-lan"><i class="dot"></i>LAN · 未知</span>
        <span class="chip" id="chip-online">在线设备 · -</span>
        <span class="chip accent" id="chip-sessions" title="本机内核连接跟踪表条目总数：含内网设备经本机转发的会话及本机自身发起的连接；并非上游光猫/运营商设备的会话表">出口会话 · -</span>
      </div>
      <div class="top-right">
        <span id="demo-badge" class="demo-badge hidden">演示模式 · 数据为模拟</span>
        <span class="muted" id="top-clock"></span>
        <button id="btn-logout" class="btn ghost sm">退出登录</button>
      </div>
    </header>

    <section class="view" id="view-overview"></section>
    <section class="view hidden" id="view-devices"></section>
    <section class="view hidden" id="view-leases"></section>
    <section class="view hidden" id="view-traffic"></section>
    <section class="view hidden" id="view-sessions"></section>
    <section class="view hidden" id="view-apps"></section>
    <section class="view hidden" id="view-gateways"></section>
    <section class="view hidden" id="view-settings"></section>
    <section class="view hidden" id="view-system"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/charts.js?v=111"></script>
<script src="/js/app.js?v=111"></script>
</body>
</html>
