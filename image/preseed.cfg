# 易路由 EasyRouter —— Debian 13 完全离线自动安装 preseed
# 安装过程不访问网络；依赖全部来自 ISO 内置的 Debian 包池。
# 注意：安装会格式化你选择的磁盘。
d-i debian-installer/locale string zh_CN.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string easyrouter
d-i netcfg/get_domain string lan

# 控制台 root 密码（安装后请立即修改；网页管理密码在安装向导中设置）
d-i passwd/root-password password EasyRouter@2026
d-i passwd/root-password-again password EasyRouter@2026

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai

# 磁盘：不预先指定，安装时由你选择目标磁盘，避免误格式化
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/disable_cdrom boolean false
d-i tasksel/first multiselect
d-i pkgsel/install-language-support boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note

# 安装易路由：把 ISO 挂到目标系统的 /cdrom，离线 apt 源直接使用该目录
d-i preseed/late_command string mkdir -p /target/opt /target/tmp /target/cdrom && cp /cdrom/easyrouter.tar.gz /target/tmp/ && mount --bind /cdrom /target/cdrom && in-target tar xzf /tmp/easyrouter.tar.gz -C /opt && in-target bash /opt/EasyRouter/image/install-in-target.sh && umount /target/cdrom
